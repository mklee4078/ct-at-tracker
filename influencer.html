<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>인플루언서 트래커</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo',Pretendard,sans-serif;font-size:13px;background:#f5f6f8;color:#1a1d27;min-height:100vh}
:root{--ac:#c0392b;--yt:#d94f4f;--ig:#c13584;--up:#1a9e5c;--dn:#d94f4f;--bd:#e2e4ea;--bd2:#d0d3dc;--sub:#f0f1f4;--muted:#8a90a0;--text:#1a1d27;--sub2:#4b5263;--mono:'DM Mono',monospace}
.nav{display:flex;align-items:center;background:#fff;border-bottom:1px solid var(--bd);padding:0 24px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.nav-logo{font-size:14px;font-weight:700;padding:15px 0;margin-right:20px;white-space:nowrap;color:var(--ac)}
.nav-tabs{display:flex;flex:1}
.tb{padding:15px 14px 13px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;font-family:inherit;transition:all .15s}
.tb:hover{color:var(--text)}.tb.on{color:var(--ac);border-bottom-color:var(--ac)}
.nav-r{display:flex;gap:7px;align-items:center;margin-left:auto}
.sync-info{font-size:10px;color:var(--muted);font-family:var(--mono)}
.btn{padding:6px 12px;border-radius:7px;border:1px solid var(--bd2);background:#fff;color:var(--sub2);font-size:11px;font-weight:500;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--sub)}.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd2);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
.page{display:none}.page.on{display:block}
.ctrl{display:flex;gap:9px;align-items:center;padding:9px 24px;background:#fff;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.fl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.fg{display:flex;gap:5px;align-items:center}
.pill{padding:3px 10px;border-radius:20px;border:1px solid var(--bd2);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;font-weight:500}
.pill:hover{border-color:var(--ac);color:var(--ac)}.pill.a{border-color:var(--ac);color:var(--ac);background:rgba(192,57,43,.07)}
.si{background:#fff;border:1px solid var(--bd2);border-radius:7px;color:var(--text);padding:5px 10px;font-size:12px;font-family:inherit}
select{background:#fff;border:1px solid var(--bd2);border-radius:7px;color:var(--text);padding:5px 8px;font-size:12px;font-family:inherit;cursor:pointer}
.main{padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.scards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sc{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:13px 15px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sc-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;font-weight:600}
.sc-v{font-size:20px;font-weight:700;font-family:var(--mono)}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--muted)}
.tc{background:#fff;border:1px solid var(--bd);border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.th{display:flex;justify-content:space-between;align-items:center;padding:10px 15px;border-bottom:1px solid var(--bd)}
.th-t{font-size:13px;font-weight:600}.th-m{font-size:11px;color:var(--muted)}
.ts{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
thead tr{background:var(--sub);border-bottom:1px solid var(--bd)}
th{padding:7px 9px;text-align:left;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
tbody tr{border-top:1px solid var(--bd)}tbody tr:hover{background:#f7f8fc}
td{padding:7px 9px;white-space:nowrap;vertical-align:middle}
.bt{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:700}
.byt{background:rgba(217,79,79,.12);color:var(--yt)}.big{background:rgba(193,53,132,.12);color:var(--ig)}
.mono{font-family:var(--mono);font-size:12px}
.nl{color:var(--text);text-decoration:none}.nl:hover{color:var(--ac)}
.cc{font-family:var(--mono);font-size:10px;color:var(--muted)}
.ab{background:none;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;font-size:12px;border-radius:3px}
.ab:hover{color:var(--ac);background:rgba(192,57,43,.07)}
.ch{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;background:var(--sub);color:var(--sub2);border:1px solid var(--bd)}
.empty{padding:60px 24px;text-align:center;color:var(--muted)}
.empty h2{font-size:14px;color:var(--sub2);font-weight:600;margin-bottom:6px}
.ei{font-size:30px;margin-bottom:10px;opacity:.4}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center}
.mo.on{display:flex}
.modal{background:#fff;border:1px solid var(--bd);border-radius:12px;width:720px;max-width:95vw;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.mt{font-size:14px;font-weight:700;margin-bottom:3px}.ms{font-size:11px;color:var(--muted);margin-bottom:14px}
.mc{float:right;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px}
.cts{display:flex;gap:5px;margin-bottom:12px}
.ct{padding:3px 10px;border-radius:5px;border:1px solid var(--bd2);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit}
.ct.on{background:var(--ac);border-color:var(--ac);color:#fff}
.cw{position:relative;height:250px}
.ib{background:rgba(192,57,43,.05);border:1px solid rgba(192,57,43,.15);border-radius:8px;padding:10px 13px;font-size:12px;margin:14px 24px 0;line-height:1.8;color:var(--sub2)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;border-radius:8px;padding:9px 14px;font-size:12px;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;z-index:999}
.toast.on{opacity:1;transform:translateY(0)}.toast.ok{background:var(--up)}.toast.err{background:var(--dn)}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-logo">📣 인플루언서 트래커</div>
  <div class="nav-tabs">
    <div class="tb on" id="tab-infl" onclick="gPage('infl',this)">👤 인플루언서</div>
    <div class="tb" id="tab-links" onclick="gPage('links',this)">🔗 링크 성과</div>
  </div>
  <div class="nav-r">
    <span class="sync-info" id="syncInfo"></span>
    <a class="btn" href="index.html" style="text-decoration:none">📊 상품 트래커</a>
    <button class="btn pri" onclick="loadData()">🔄 새로고침</button>
  </div>
</div>

<!-- INFLUENCERS -->
<div class="page on" id="page-infl">
  <div class="ctrl">
    <div class="fg"><span class="fl">플랫폼</span>
      <button class="pill a" onclick="setPlat('infl','all',this)">전체</button>
      <button class="pill" onclick="setPlat('infl','youtube',this)">유튜브</button>
      <button class="pill" onclick="setPlat('infl','instagram',this)">인스타</button>
    </div>
    <div class="fg"><span class="fl">기간</span>
      <input type="date" class="si" id="fromDate" style="width:132px" onchange="render()">
      <span style="color:var(--muted)">~</span>
      <input type="date" class="si" id="toDate" style="width:132px" onchange="render()">
      <button class="pill" onclick="setRange(7)">7일</button>
      <button class="pill" onclick="setRange('all')">전체</button>
    </div>
    <input class="si" id="q" placeholder="인플루언서 검색" oninput="render()" style="margin-left:auto;width:160px">
  </div>
  <div class="main">
    <div class="scards">
      <div class="sc"><div class="sc-l">추적 인플루언서</div><div class="sc-v" id="sc-cnt">—</div></div>
      <div class="sc"><div class="sc-l">유튜브 총 구독자</div><div class="sc-v" id="sc-subs">—</div><div class="sc-d" id="sd-subs" style="font-size:11px;margin-top:3px"></div></div>
      <div class="sc"><div class="sc-l">인스타 총 팔로워</div><div class="sc-v" id="sc-fol">—</div><div class="sc-d" id="sd-fol" style="font-size:11px;margin-top:3px"></div></div>
      <div class="sc"><div class="sc-l">누적 일수</div><div class="sc-v" id="sc-days">—</div></div>
    </div>
    <div class="tc">
      <div class="th"><div class="th-t">인플루언서 목록</div><div class="th-m" id="iMeta"></div></div>
      <div class="ts" id="iCon"><div class="empty"><div class="ei">📣</div><h2>🔄 새로고침을 눌러주세요</h2></div></div>
    </div>
  </div>
</div>

<!-- LINKS -->
<div class="page" id="page-links">
  <div class="ctrl">
    <div class="fg"><span class="fl">플랫폼</span>
      <button class="pill a" onclick="setPlat('links','all',this)">전체</button>
      <button class="pill" onclick="setPlat('links','youtube',this)">유튜브</button>
      <button class="pill" onclick="setPlat('links','instagram',this)">인스타</button>
    </div>
    <div class="fg"><span class="fl">브랜드</span>
      <select id="lBrand" onchange="renderLinks()">
        <option value="">전체</option><option value="시티브리즈">시티브리즈</option><option value="아티드">아티드</option>
      </select>
    </div>
  </div>
  <div class="ib"><strong>우리 링크 성과</strong> — 협업 콘텐츠(유튜브 영상·인스타 게시물)의 조회수·좋아요·댓글을 매일 추적합니다. 링크는 입력 시트에 추가하세요.</div>
  <div class="main" id="lMain"><div class="empty"><div class="ei">🔗</div><h2>링크 데이터 없음</h2></div></div>
</div>

<!-- MODAL -->
<div class="mo" id="mOver" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="modal">
    <button class="mc" onclick="document.getElementById('mOver').classList.remove('on')">✕</button>
    <div class="mt" id="mTit"></div><div class="ms" id="mSub"></div>
    <div class="cts" id="mCts"></div>
    <div class="cw"><canvas id="tChart"></canvas></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let data={influencers:[],links:[],snapshotDates:[]}, snaps={}, linkSnaps={};
let plat={infl:'all',links:'all'}, myChart=null, cName=null, cMetric='subs', cType='infl';

async function loadData(){
  const si=document.getElementById('syncInfo');
  si.innerHTML='<span class="spin"></span>로딩...';
  try{
    const base=window.location.href.replace(/\/[^/]*$/,'/');
    const t=Date.now();
    const res=await fetch(base+'influencer_data/data.json?t='+t);
    if(!res.ok)throw new Error('data.json 없음 ('+res.status+')');
    data=await res.json();
    const dates=data.snapshotDates||[];
    for(const d of dates){
      if(!snaps[d]){try{const r=await fetch(base+'influencer_data/snapshots/'+d+'.json?t='+t);if(r.ok)snaps[d]=await r.json();}catch(e){}}
      if(!linkSnaps[d]){try{const r=await fetch(base+'influencer_data/links/'+d+'.json?t='+t);if(r.ok)linkSnaps[d]=await r.json();}catch(e){}}
    }
    updDateRange();render();renderLinks();
    const ts=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    si.textContent='✓ '+ts+' 동기화'+(data.meta&&data.meta.mock?' (샘플)':'');
  }catch(e){si.textContent='⚠ 실패';toast(e.message,'err');console.error(e);}
}

function gPage(id,el){
  ['infl','links'].forEach(p=>{document.getElementById('page-'+p).classList.remove('on');document.getElementById('tab-'+p).classList.remove('on');});
  document.getElementById('page-'+id).classList.add('on');el.classList.add('on');
  if(id==='links')renderLinks();
}
function setPlat(tab,v,btn){plat[tab]=v;btn.closest('.fg').querySelectorAll('.pill').forEach(p=>p.className='pill');btn.className='pill a';tab==='links'?renderLinks():render();}

const dates=()=>data.snapshotDates||[];
function updDateRange(){const ds=dates();if(!ds.length)return;const f=document.getElementById('fromDate'),t=document.getElementById('toDate');f.min=t.min=ds[0];f.max=t.max=ds[ds.length-1];if(!f.value)f.value=ds[0];if(!t.value)t.value=ds[ds.length-1];}
function rTo(){const v=document.getElementById('toDate').value;const ds=dates();return v||ds[ds.length-1];}
function rFrom(){const v=document.getElementById('fromDate').value;const ds=dates();return v||ds[0];}
function endDate(){const ds=dates();let r=null;for(const d of ds)if(d<=rTo())r=d;return r||ds[ds.length-1];}
function startDate(){const ds=dates();for(const d of ds)if(d>=rFrom())return d;return ds[0];}
function setRange(n){const ds=dates();if(!ds.length)return;const hi=ds[ds.length-1];document.getElementById('toDate').value=hi;if(n==='all')document.getElementById('fromDate').value=ds[0];else{const c=new Date(hi);c.setDate(c.getDate()-n);const cs=c.toISOString().slice(0,10);document.getElementById('fromDate').value=ds.find(d=>d>=cs)||ds[0];}render();}

function val(name,field,dt){const s=snaps[dt]||[];const r=s.find(x=>x.name===name);return r&&r[field]!=null?r[field]:null;}
function metricOf(inf){return inf.platform==='youtube'?'subs':'followers';}
function dH(v){if(v==null)return'<span class="flat">—</span>';if(v===0)return'<span class="flat">0</span>';return`<span class="${v>0?'up':'dn'}">${v>0?'+':''}${v.toLocaleString()}</span>`;}

function render(){
  const el=document.getElementById('iCon');
  if(!dates().length){el.innerHTML='<div class="empty"><div class="ei">📣</div><h2>데이터 없음</h2></div>';return;}
  updDateRange();
  const e=endDate(),s=startDate();
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  let list=(data.influencers||[]).filter(i=>plat.infl==='all'||i.platform===plat.infl);
  if(q)list=list.filter(i=>i.name.toLowerCase().includes(q)||(i.handle||'').toLowerCase().includes(q));
  // summary
  document.getElementById('sc-cnt').textContent=list.length;
  document.getElementById('sc-days').textContent=dates().length+'일';
  const subsE=(data.influencers||[]).filter(i=>i.platform==='youtube').reduce((a,i)=>a+(val(i.name,'subs',e)||0),0);
  const subsS=(data.influencers||[]).filter(i=>i.platform==='youtube').reduce((a,i)=>a+(val(i.name,'subs',s)||0),0);
  const folE=(data.influencers||[]).filter(i=>i.platform==='instagram').reduce((a,i)=>a+(val(i.name,'followers',e)||0),0);
  const folS=(data.influencers||[]).filter(i=>i.platform==='instagram').reduce((a,i)=>a+(val(i.name,'followers',s)||0),0);
  document.getElementById('sc-subs').textContent=subsE?subsE.toLocaleString():'—';
  document.getElementById('sc-fol').textContent=folE?folE.toLocaleString():'—';
  document.getElementById('sd-subs').innerHTML=s!==e?dH(subsE-subsS)+' <span style="color:var(--muted)">기간</span>':'';
  document.getElementById('sd-fol').innerHTML=s!==e?dH(folE-folS)+' <span style="color:var(--muted)">기간</span>':'';
  document.getElementById('iMeta').textContent=`${list.length}명 · ${s} ~ ${e}`;
  // rows
  const prev=dates()[dates().indexOf(e)-1];
  const rows=list.map(i=>{
    const m=metricOf(i);
    const cur=val(i.name,m,e), d1=prev!=null?(cur!=null&&val(i.name,m,prev)!=null?cur-val(i.name,m,prev):null):null;
    const dR=(s!==e&&cur!=null&&val(i.name,m,s)!=null)?cur-val(i.name,m,s):null;
    return{...i,cur,d1,dR,av:val(i.name,i.platform==='youtube'?'avg_views':'reel_views',e)};
  }).sort((a,b)=>(b.cur||0)-(a.cur||0));
  const tb=rows.map(r=>{
    const badge=r.platform==='youtube'?'<span class="bt byt">YT</span>':'<span class="bt big">IG</span>';
    const label=r.platform==='youtube'?'구독자':'팔로워';
    return`<tr>
      <td>${badge}</td>
      <td><span class="nl" style="font-weight:600">${r.name}</span></td>
      <td class="cc">${r.handle||'—'}</td>
      <td class="mono" style="font-weight:700">${r.cur!=null?r.cur.toLocaleString():'—'}</td>
      <td class="mono">${dH(r.d1)}</td>
      <td class="mono" style="font-weight:600">${dH(r.dR)}</td>
      <td class="mono">${r.av!=null?r.av.toLocaleString():'—'}</td>
      <td><button class="ab" onclick="openChart('infl','${r.name.replace(/'/g,"")}','${r.platform}')">📈</button></td>
    </tr>`;
  }).join('');
  el.innerHTML=`<table><thead><tr><th>플랫폼</th><th>인플루언서</th><th>계정</th><th>구독자/팔로워</th><th>1일↕</th><th>기간↕</th><th>평균조회수</th><th></th></tr></thead><tbody>${tb}</tbody></table>`;
}

function renderLinks(){
  const el=document.getElementById('lMain');
  const brand=document.getElementById('lBrand').value;
  let links=(data.links||[]).filter(l=>plat.links==='all'||l.platform===plat.links).filter(l=>!brand||l.brand===brand);
  if(!links.length){el.innerHTML='<div class="empty"><div class="ei">🔗</div><h2>링크 데이터 없음</h2><p style="font-size:12px;margin-top:6px">입력 시트에 협업 링크를 추가하면 여기에 성과가 뜹니다</p></div>';return;}
  const e=dates()[dates().length-1],prev=dates()[dates().length-2];
  const lv=(id,field,dt)=>{const s=linkSnaps[dt]||[];const r=s.find(x=>x.id===id);return r&&r[field]!=null?r[field]:null;};
  const rows=links.map(l=>{
    const v=lv(l.id,'views',e),vp=prev?lv(l.id,'views',prev):null;
    return{...l,views:v,likes:lv(l.id,'likes',e),comments:lv(l.id,'comments',e),dv:(v!=null&&vp!=null)?v-vp:null};
  }).sort((a,b)=>(b.views||0)-(a.views||0));
  const tb=rows.map(l=>{
    const badge=l.platform==='youtube'?'<span class="bt byt">YT</span>':'<span class="bt big">IG</span>';
    return`<tr>
      <td>${badge}</td><td><span class="nl" style="font-weight:600">${l.name}</span></td>
      <td><span class="ch">${l.brand||'—'}</span></td>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;font-size:12px">${l.title||'—'}</td>
      <td class="cc">${l.campaign||'—'}</td>
      <td class="mono" style="font-weight:700">${l.views!=null?l.views.toLocaleString():'—'}</td>
      <td class="mono">${dH(l.dv)}</td>
      <td class="mono">${l.likes!=null?l.likes.toLocaleString():'—'}</td>
      <td class="mono">${l.comments!=null?l.comments.toLocaleString():'—'}</td>
      <td>${l.url?`<a href="${l.url}" target="_blank" class="ab">↗</a>`:''}</td>
      <td><button class="ab" onclick="openChart('link','${l.id}','${l.platform}')">📈</button></td>
    </tr>`;
  }).join('');
  el.innerHTML=`<div class="tc"><div class="th"><div class="th-t">우리 링크 성과</div><div class="th-m">${rows.length}개 · ${e} 기준</div></div>
    <div class="ts"><table><thead><tr><th>플랫폼</th><th>인플루언서</th><th>브랜드</th><th>콘텐츠</th><th>기획전</th><th>조회수</th><th>1일↕</th><th>좋아요</th><th>댓글</th><th>링크</th><th></th></tr></thead><tbody>${tb}</tbody></table></div></div>`;
}

function openChart(type,key,platform){
  cType=type;cName=key;
  const metrics=type==='infl'
    ?(platform==='youtube'?[['subs','구독자'],['avg_views','평균조회수'],['avg_comments','평균댓글']]:[['followers','팔로워'],['reel_views','릴스조회'],['reel_likes','릴스좋아요']])
    :[['views','조회수'],['likes','좋아요'],['comments','댓글']];
  cMetric=metrics[0][0];
  document.getElementById('mTit').textContent=type==='infl'?key:(data.links.find(l=>l.id===key)||{}).title||key;
  document.getElementById('mSub').textContent=platform==='youtube'?'YouTube':'Instagram';
  document.getElementById('mCts').innerHTML=metrics.map((m,i)=>`<button class="ct ${i===0?'on':''}" onclick="swC('${m[0]}',this)">${m[1]}</button>`).join('');
  document.getElementById('mOver').classList.add('on');drawChart();
}
function swC(m,btn){cMetric=m;document.querySelectorAll('#mCts .ct').forEach(b=>b.classList.remove('on'));btn.classList.add('on');drawChart();}
function drawChart(){
  const ds=dates();
  const vals=ds.map(d=>{
    if(cType==='infl'){const s=snaps[d]||[];const r=s.find(x=>x.name===cName);return r?r[cMetric]:null;}
    else{const s=linkSnaps[d]||[];const r=s.find(x=>x.id===cName);return r?r[cMetric]:null;}
  });
  if(myChart)myChart.destroy();
  myChart=new Chart(document.getElementById('tChart').getContext('2d'),{
    type:'line',data:{labels:ds,datasets:[{data:vals,borderColor:'#c0392b',backgroundColor:'rgba(192,57,43,.1)',fill:true,tension:.35,pointRadius:4,pointBackgroundColor:'#c0392b',pointBorderColor:'#fff',pointBorderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8a90a0',font:{size:10}},grid:{color:'#e2e4ea'}},y:{ticks:{color:'#8a90a0',font:{size:10}},grid:{color:'#e2e4ea'},beginAtZero:false}}}
  });
}
let tt;function toast(m,t=''){const el=document.getElementById('toast');el.textContent=m;el.className='toast on '+t;clearTimeout(tt);tt=setTimeout(()=>el.className='toast',2800);}
loadData();
</script>
